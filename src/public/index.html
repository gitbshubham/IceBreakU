<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IceBreakU</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
    <div id="app">
        <header>
            <h1><i class="fas fa-icicles"></i> IceBreakU</h1>
        </header>
        <main>
            <div id="interest-container">
                <input type="text" id="interests-input" placeholder="Enter interests (comma-separated)">
                <button id="find-match"><i class="fas fa-snowflake"></i> Break the Ice</button>
            </div>
            <div id="video-container">
                <div class="video-wrapper">
                    <video id="local-video" autoplay muted></video>
                    <span class="video-label">You</span>
                </div>
                <div class="video-wrapper">
                    <video id="remote-video" autoplay></video>
                    <span class="video-label">New Friend</span>
                </div>
            </div>
            <div id="chat-container">
                <div id="messages"></div>
                <div class="input-group">
                    <input type="text" id="message-input" placeholder="Type your icebreaker...">
                    <button id="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
            <div id="chat-controls">
                <button id="leave-chat"><i class="fas fa-sign-out-alt"></i> Leave Chat</button>
                <button id="new-match"><i class="fas fa-sync"></i> Find New Match</button>
            </div>
        </main>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
